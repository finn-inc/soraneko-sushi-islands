<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>そらねこ寿司諸島</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231c2a22'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23fffaf0'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23ff8440'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #2b2230; --paper: #fffaf0; --salmon: #ff8440; --nori: #1c2a22;
    --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9c2; font-family: var(--font); color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
    touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .shadowed { text-shadow: 0 2px 14px rgba(30, 20, 50, .35), 0 1px 2px rgba(30, 20, 50, .35); }

  /* ---- HUD ---- */
  #hud { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
  #hud.on { opacity: 1; }
  #count { position: absolute; left: calc(28px + env(safe-area-inset-left, 0px)); top: 24px; display: flex; align-items: center; gap: 12px; }
  .maki { width: 34px; height: 34px; border-radius: 50%; background: var(--paper); border: 6px solid var(--nori);
    box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 12px var(--salmon), 0 3px 12px rgba(20,10,40,.3); }
  #countNum { font-size: 40px; font-weight: 700; letter-spacing: .02em; line-height: 1; display: inline-block; transform-origin: left center; }
  #count .unit { font-size: 17px; opacity: .9; margin-left: -6px; align-self: flex-end; padding-bottom: 3px; }
  #countNum.pop { animation: pop .28s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }

  #dial { position: absolute; right: calc(84px + env(safe-area-inset-right, 0px)); top: 20px; width: 132px; height: 62px; opacity: .95; }
  #dial svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 8px rgba(30, 20, 50, .35)); }

  #combo { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .5s ease; white-space: nowrap; }
  #combo.on { opacity: 1; transition: opacity .1s; }
  #comboNum { font-size: 46px; font-weight: 700; line-height: 1; display: inline-block; }
  #comboNum.pop { animation: pop .3s cubic-bezier(.2, 1.8, .4, 1); }
  #combo .lab { font-size: 17px; letter-spacing: .3em; margin-left: .3em; opacity: .95; }
  #cheer { font-size: 19px; letter-spacing: .2em; margin-top: 6px; height: 1.4em; opacity: 0; transition: opacity .4s; }
  #cheer.on { opacity: 1; }

  #hint { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); padding: 12px 26px; border-radius: 999px;
    background: rgba(40, 28, 56, .38); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 17px; letter-spacing: .12em;
    white-space: nowrap; opacity: 0; transition: opacity .9s ease; }
  #hint.on { opacity: 1; }

  #reticle { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; }
  #reticle.on { opacity: 1; }
  #retRing { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .4); }
  #retDot { position: absolute; left: 0; top: 0; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: rgba(255, 255, 255, .85);
    box-shadow: 0 0 10px rgba(255, 220, 160, .9); will-change: transform; }
  #retLine { position: absolute; left: 50%; top: 50%; height: 1.5px; width: 100px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5)); transform-origin: 0 50%; will-change: transform; }

  #arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .3s; will-change: transform; }
  #arrow.on { opacity: 1; }
  #arrow::before { content: ""; position: absolute; left: -15px; top: -19px; border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-bottom: 25px solid #fff6d8; filter: drop-shadow(0 0 8px rgba(255, 200, 120, .95)); animation: nudge .8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(-7px); } }

  /* ---- タイトル ---- */
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center;
    transition: opacity .9s ease, transform 1.2s ease; padding-top: 10vh; }
  #title.off { opacity: 0; transform: translateY(-24px); }
  #title .kicker { font-size: 14px; letter-spacing: .62em; margin-right: -.62em; opacity: .92; }
  #title h1 { margin: 18px 0 6px; font-size: clamp(44px, 8.2vw, 116px); font-weight: 700; letter-spacing: .08em; line-height: 1.1;
    text-shadow: 0 4px 0 rgba(200, 70, 60, .55), 0 10px 36px rgba(60, 20, 60, .35); }
  #title h1 .s { color: #ffe9a8; }
  #title .tag { font-family: var(--serif); font-size: clamp(15px, 1.6vw, 21px); letter-spacing: .3em; margin: 10px 0 0; opacity: .96; }
  #title .start { position: absolute; bottom: 13vh; padding: 15px 38px; border-radius: 999px; font-size: 18px; letter-spacing: .34em; text-indent: .34em; color: var(--ink);
    background: rgba(255, 250, 240, .94); box-shadow: 0 8px 30px rgba(60, 20, 60, .28); animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.045); box-shadow: 0 10px 40px rgba(255, 140, 80, .5); } }
  .rule { width: 64px; height: 2px; background: rgba(255,255,255,.85); margin: 18px auto 0; border-radius: 2px; }

  /* ---- リザルト ---- */
  #result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 7vw; opacity: 0; transition: opacity 1.2s ease; }
  @media (max-width: 900px) { #result { justify-content: center; padding-right: 0; } }
  #result.on { opacity: 1; }
  #result.on .card { pointer-events: auto; transform: none; }
  .card { width: min(520px, 92vw); padding: 38px 44px 36px; border-radius: 28px; text-align: center; color: #fff;
    background: linear-gradient(180deg, rgba(24, 28, 70, .62), rgba(14, 16, 44, .72)); border: 1px solid rgba(255, 255, 255, .16);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 24px 80px rgba(0, 0, 20, .5); transform: translateY(18px); transition: transform 1.2s cubic-bezier(.2, .9, .3, 1); }
  .card .k { font-size: 13px; letter-spacing: .5em; text-indent: .5em; opacity: .75; }
  .card .rank { font-family: var(--serif); font-size: clamp(22px, 3vw, 32px); letter-spacing: .12em; white-space: nowrap; margin: 14px 0 4px; color: #ffe9a8; text-shadow: 0 0 24px rgba(255, 200, 120, .45); }
  .card .note { font-size: 14px; letter-spacing: .16em; opacity: .8; min-height: 1.5em; }
  .stats { display: flex; justify-content: center; gap: 46px; margin: 26px 0 30px; }
  .stat .v { font-size: 50px; font-weight: 700; line-height: 1; }
  .stat .v small { font-size: 17px; font-weight: 400; margin-left: 4px; opacity: .85; }
  .stat .l { font-size: 13px; letter-spacing: .3em; opacity: .75; margin-top: 10px; }
  #again { font-family: var(--font); cursor: pointer; border: 0; padding: 15px 44px; border-radius: 999px; font-size: 18px; letter-spacing: .3em; text-indent: .3em;
    color: var(--ink); background: #fffaf0; box-shadow: 0 8px 30px rgba(255, 150, 90, .35); transition: transform .15s ease, box-shadow .15s ease; }
  #again:hover { transform: scale(1.05); box-shadow: 0 10px 40px rgba(255, 150, 90, .6); }

  #goodnight { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--serif); font-size: clamp(24px, 3vw, 38px); letter-spacing: .5em; text-indent: .5em;
    opacity: 0; transition: opacity 1.4s ease; white-space: nowrap; }
  #goodnight.on { opacity: 1; }

  #mute { position: absolute; right: calc(24px + env(safe-area-inset-right, 0px)); top: 24px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; pointer-events: auto;
    background: rgba(40, 28, 56, .34); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; transition: background .2s; }
  #mute:hover { background: rgba(40, 28, 56, .55); }
  #mute svg { width: 22px; height: 22px; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: block; }

  /* ---- タッチ端末（スマホ・タブレット）: body.touch で切り替える ---- */
  body.touch .m, body:not(.touch) .t { display: none; }
  body.touch #hint { bottom: 22%; }
  body.touch #reticle.idle { opacity: 0; transition: opacity .25s; }
  #boost { display: none; position: absolute; right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(255, 250, 240, .75); background: rgba(40, 28, 56, .36); color: #fff;
    font-family: var(--font); font-size: 15px; letter-spacing: .22em; text-indent: .22em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    pointer-events: none; opacity: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    transition: opacity .8s ease, transform .12s ease, background .12s ease; }
  body.touch #boost { display: grid; place-items: center; }
  #boost.on { pointer-events: auto; opacity: 1; }
  #boost.held { background: rgba(255, 132, 64, .78); border-color: #fffaf0; transform: scale(.93); }
  #turn { position: absolute; left: 0; right: 0; bottom: 6.5vh; display: none; font-size: 13px; letter-spacing: .22em; text-indent: .22em; opacity: .85; }
  @media (orientation: portrait) { body.touch #turn { display: block; } }
  @media (max-width: 640px) {
    #hint { font-size: 14px; padding: 10px 18px; letter-spacing: .06em; }
    #title .start { font-size: 16px; padding: 13px 30px; letter-spacing: .26em; text-indent: .26em; }
    #title .kicker { font-size: 11px; letter-spacing: .4em; margin-right: -.4em; }
    #countNum { font-size: 34px; }
    #combo { top: 15%; } /* 日時計と重ならない高さへ */
    #title .tag { font-size: 14px; letter-spacing: .12em; padding: 0 14px; }
    .stats { gap: 30px; }
    .stat .v { font-size: 40px; }
  }

  #fade { position: absolute; inset: 0; background: #fff6ea; opacity: 0; transition: opacity .55s ease; }
  #fade.on { opacity: 1; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #ffd9c2; color: #8a4a3a; font-size: 16px; letter-spacing: .4em; transition: opacity .8s ease; }
  #loading.off { opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div id="count" class="shadowed"><span class="maki"></span><span id="countNum">0</span><span class="unit">貫</span></div>
    <div id="dial">
      <svg viewBox="0 0 132 62">
        <path d="M10 54 A56 56 0 0 1 122 54" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
        <path id="dialProg" d="M10 54 A56 56 0 0 1 122 54" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
        <path d="M126 50 a7 7 0 1 0 4 9 a5.4 5.4 0 0 1 -4 -9z" fill="rgba(255,255,255,.85)"/>
        <circle id="dialSun" cx="10" cy="54" r="7" fill="#ffd98a"/>
      </svg>
    </div>
  </div>
  <div id="reticle"><div id="retRing"></div><div id="retLine"></div><div id="retDot"></div></div>
  <div id="arrow"></div>
  <div id="combo" class="shadowed"><div><span id="comboNum">0</span><span class="lab">れんぞく</span></div><div id="cheer"></div></div>
  <div id="hint" class="shadowed"><span class="m">マウスを向けたほうへ飛ぶ　・　左クリック長押しで加速</span><span class="t">なぞった方へ飛ぶ　・　右下を長押しで加速</span></div>
  <div id="goodnight" class="shadowed">おやすみ、そらねこ</div>

  <div id="title" class="shadowed">
    <div class="kicker">SORANEKO ・ SUSHI ISLANDS</div>
    <h1>そらねこ<span class="s">寿司</span>諸島</h1>
    <div class="rule"></div>
    <p class="tag">ある晴れた一日、ねこは お寿司の海を飛んだ。</p>
    <div class="start"><span class="m">クリックして とびたつ</span><span class="t">タップして とびたつ</span></div>
    <div id="turn">よこ向きにすると 見やすいよ</div>
  </div>

  <div id="result">
    <div class="card">
      <div class="k">きょうのフライト</div>
      <div class="rank" id="rank"></div>
      <div class="note" id="rankNote"></div>
      <div class="stats">
        <div class="stat"><div class="v"><span id="resCount">0</span><small>貫</small></div><div class="l">あつめたお寿司</div></div>
        <div class="stat"><div class="v"><span id="resCombo">0</span><small>連</small></div><div class="l">最大れんぞく</div></div>
      </div>
      <button id="again">もう一度とぶ</button>
    </div>
  </div>

  <button id="mute" aria-label="音のオン・オフ">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button id="boost" aria-label="加速">加速</button>
  <div id="fade"></div>
  <div id="loading">じゅんびちゅう…</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
